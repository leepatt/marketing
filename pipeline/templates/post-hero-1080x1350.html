<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../tokens.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: var(--font-body);
    background: var(--bg-invert);
    color: var(--fg-invert);
    position: relative;
    overflow: hidden;
  }

  /* Signature curved-line motif — big, once, behind hero text.
     Placeholder SVG approximation; swap for assets/pattern-green-on-black-*.png from Drive. */
  .motif {
    position: absolute; inset: -10% -20% auto auto; width: 1200px; height: 1200px;
    opacity: 0.5; pointer-events: none;
  }
  .motif path { fill: none; stroke: var(--craftons-line-green); stroke-width: 2; }

  .ground-tint { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 80% 0%, transparent 40%, var(--craftons-green-900) 100%); }

  .frame { position: relative; height: 100%; padding: var(--sp-12) var(--sp-11);
    display: flex; flex-direction: column; }

  /* Top row — wordmark + url */
  .top { display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-family: var(--font-display); font-weight: 700; font-size: 34px;
    letter-spacing: var(--tracking-tight); }
  .url { font-family: var(--font-mono); font-size: 18px; color: var(--craftons-line-green); }

  /* Eyebrow */
  .eyebrow { margin-top: auto; font-size: 17px; font-weight: 600;
    text-transform: uppercase; letter-spacing: var(--tracking-widest);
    color: var(--craftons-line-green); }

  /* Headline — display heavy */
  .headline { font-family: var(--font-display); font-weight: 500;
    font-size: 92px; line-height: 1.02; letter-spacing: var(--tracking-tighter);
    margin-top: var(--sp-5); max-width: 16ch; }

  .subhead { font-size: 26px; line-height: 1.5; color: #cfe0d6;
    margin-top: var(--sp-6); max-width: 30ch; }

  /* Compliance / spec stamp row — ALL CAPS, condensed face only here */
  .stamps { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-9); }
  .stamp { font-family: var(--font-stencil); text-transform: uppercase;
    font-size: 22px; letter-spacing: var(--tracking-wide); line-height: 1;
    color: var(--craftons-green-900); background: var(--craftons-line-green);
    padding: 12px 16px; border-radius: var(--r-md); }
  .stamp.outline { background: transparent; color: var(--craftons-line-green);
    box-shadow: inset 0 0 0 2px var(--craftons-line-green); }

  /* CTA button — square-ish, dark green on light */
  .cta { margin-top: var(--sp-9); align-self: flex-start;
    font-family: var(--font-body); font-weight: 600; font-size: 22px;
    color: var(--craftons-green-900); background: var(--white);
    padding: 18px 28px; border-radius: var(--r-md); }
</style>
</head>
<body class="craftons">
  <svg class="motif" viewBox="0 0 600 600" aria-hidden="true">
    <path d="M-50 300 C 150 60, 450 60, 650 300 S 450 540, 250 420 S -10 180, 200 120" />
    <path d="M-50 360 C 150 120, 450 120, 650 360 S 450 600, 250 480 S -10 240, 200 180" />
    <path d="M-50 240 C 150 0, 450 0, 650 240 S 450 480, 250 360 S -10 120, 200 60" />
    <path d="M-50 420 C 170 200, 460 200, 660 420 S 440 660, 240 540" />
  </svg>
  <div class="ground-tint"></div>

  <div class="frame">
    <div class="top">
      <div class="wordmark">Craftons</div>
      <div class="url">{{URL}}</div>
    </div>

    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="headline">{{HEADLINE}}</h1>
    <p class="subhead">{{SUBHEAD}}</p>

    <div class="stamps">
      <span class="stamp">{{STAMP1}}</span>
      <span class="stamp outline">{{STAMP2}}</span>
      <span class="stamp outline">{{STAMP3}}</span>
    </div>

    <div class="cta">{{CTA}}</div>
  </div>
</body>
</html>
