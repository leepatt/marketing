<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
@font-face { font-family:'SG'; src:url('fonts/sg-700.woff2') format('woff2'); font-weight:700; font-display:block; }
@font-face { font-family:'SG'; src:url('fonts/sg-500.woff2') format('woff2'); font-weight:500; font-display:block; }
@font-face { font-family:'SG'; src:url('fonts/sg-400.woff2') format('woff2'); font-weight:400; font-display:block; }
@font-face { font-family:'JBM'; src:url('fonts/jbm-500.woff2') format('woff2'); font-weight:500; font-display:block; }
:root{
  --green:#194431; --green7:#123022; --line:#2d8a5b; --ink:#0e0e0c;
  --paper:#f4f1ea; --paperwarm:#efe9dd; --stone:#8a8577; --rule:#d9d3c6; --white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#viewport{position:relative;width:1080px;height:1920px;overflow:hidden}
#stage{position:absolute;inset:0;transform-origin:0 0}
#bg{position:absolute;inset:-800px}
.motif{position:absolute;pointer-events:none}
#headline{position:absolute;left:80px;right:80px;top:118px;z-index:5}
#headline h1{font-family:'SG';font-weight:700;font-size:74px;line-height:1.0;letter-spacing:-0.03em}
#headline .w{display:inline-block;white-space:pre}
#eyebrow{font-family:'JBM';font-weight:500;font-size:24px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:22px;display:flex;align-items:center;gap:12px}
#eyebrow .dot{width:12px;height:12px;border-radius:50%;background:var(--line)}

#card{position:absolute;left:70px;width:940px;top:430px;border-radius:26px;overflow:hidden;z-index:4;
  background:var(--white);box-shadow:0 50px 90px -30px rgba(10,12,10,.55),0 8px 24px rgba(10,12,10,.12)}
#chrome{height:78px;background:var(--paperwarm);display:flex;align-items:center;padding:0 26px;gap:16px;border-bottom:1px solid var(--rule)}
#chrome .dots{display:flex;gap:9px}
#chrome .dots i{width:15px;height:15px;border-radius:50%;background:#cfc9bb;display:block}
#chrome .url{flex:1;height:46px;background:var(--white);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:'JBM';font-size:24px;color:var(--ink)}
#chrome .url svg{width:18px;height:18px;color:var(--stone)}
#cardbody{padding:34px 36px 40px}
.pvwrap{display:flex;gap:30px}
#preview{width:360px;height:360px;flex:none;background:var(--paper);border-radius:16px}
.fields{flex:1;display:flex;flex-direction:column;gap:18px}
.field label{font-family:'SG';font-weight:500;font-size:26px;color:var(--ink);display:block;margin-bottom:9px}
.field .inp{height:66px;border:2px solid var(--rule);border-radius:11px;display:flex;align-items:center;padding:0 20px;font-family:'JBM';font-size:30px;color:var(--ink);background:var(--white);position:relative}
.field .inp.active{border-color:var(--line)}
.field .inp .cur{width:3px;height:34px;background:var(--line);margin-left:2px;opacity:0}
.row2{display:flex;gap:18px}.row2 .field{flex:1}
.price{margin-top:26px;padding:26px 28px;background:var(--paper);border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.price .lab{font-family:'JBM';font-size:22px;letter-spacing:0.12em;text-transform:uppercase;color:var(--stone)}
.price .val{font-family:'SG';font-weight:700;font-size:58px;letter-spacing:-0.02em;color:var(--ink)}
.actions{display:flex;gap:16px;margin-top:26px}
.btn{height:78px;border-radius:12px;font-family:'SG';font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center;gap:12px}
.btn.sec{flex:none;width:300px;background:var(--paperwarm);color:var(--ink);border:2px solid var(--rule)}
.btn.pri{flex:1;background:var(--green);color:#fff;position:relative;overflow:hidden}
.btn.pri .chk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--green);opacity:0}

#caption{position:absolute;left:80px;right:80px;bottom:250px;z-index:6;text-align:center}
#caption .cap{display:inline-block;font-family:'SG';font-weight:700;font-size:56px;letter-spacing:-0.02em;color:var(--ink);background:var(--white);padding:14px 30px;border-radius:14px;box-shadow:0 14px 30px -12px rgba(10,12,10,.4)}

#outro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green);opacity:0}
#outro .mono{width:190px;height:190px;margin-bottom:40px}
#outro .wm{font-family:'SG';font-weight:700;font-size:92px;color:#fff;letter-spacing:-0.03em}
#outro .cta{font-family:'JBM';font-weight:500;font-size:30px;color:var(--line);margin-top:26px;letter-spacing:0.02em}

#cursor{position:absolute;z-index:7;width:54px;height:54px;left:0;top:0;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
#tapring{position:absolute;z-index:7;width:80px;height:80px;border:5px solid var(--line);border-radius:50%;opacity:0;pointer-events:none}
#glow{position:absolute;z-index:5;border-radius:14px;box-shadow:0 0 0 0 rgba(45,138,91,.6);opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg"></div>
    <div id="headline"><div id="eyebrow"><span class="dot"></span><span>Radius Pro · Online</span></div><h1 id="hl"></h1></div>
    <div id="card">
      <div id="chrome"><div class="dots"><i></i><i></i><i></i></div>
        <div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>craftons.com.au</div>
      </div>
      <div id="cardbody">
        <div class="pvwrap">
          <svg id="preview" viewBox="0 0 360 360"></svg>
          <div class="fields">
            <div class="field"><label>Material</label><div class="inp" id="f-mat"><span id="v-mat"></span><span class="cur"></span></div></div>
            <div class="field"><label>Int. radius (r)</label><div class="inp" id="f-rad"><span id="v-rad"></span><span class="cur"></span></div></div>
            <div class="row2">
              <div class="field"><label>Width (w)</label><div class="inp" id="f-wid"><span id="v-wid"></span><span class="cur"></span></div></div>
              <div class="field"><label>Angle (θ)</label><div class="inp" id="f-ang"><span id="v-ang"></span><span class="cur"></span></div></div>
            </div>
          </div>
        </div>
        <div class="price"><span class="lab">Live estimate</span><span class="val" id="v-price">$0.00</span></div>
        <div class="actions">
          <div class="btn sec">Save and share</div>
          <div class="btn pri" id="cart">Add to cart<div class="chk">Added <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div></div>
        </div>
      </div>
    </div>
    <div id="glow"></div>
    <div id="caption"></div>
    <div id="outro"><svg class="mono" id="mono" viewBox="0 0 100 100"></svg><div class="wm">Craftons</div><div class="cta">Configure yours · craftons.com.au</div></div>
    <svg id="cursor" viewBox="0 0 24 24" fill="#fff" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"><path d="M5 2.5l4.4 17 2.7-6.7 6.6-1.7L5 2.5z"/></svg>
    <div id="tapring"></div>
  </div>
</div>
<script src="scene.js"></script>
</body>
</html>
